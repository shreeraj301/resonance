name: Feature request
description: An idea for the visualizer, the synth, or the project around them.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing?
      description: Who is this for, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, similar tools, or a smaller first version are welcome.
